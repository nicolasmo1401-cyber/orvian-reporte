name: Actualización Manual

# Solo se lanza manualmente — útil para actualizar el reporte
# sin esperar la hora programada nocturna.
on:
  workflow_dispatch:
    inputs:
      mensaje:
        description: "Descripción del cambio (opcional)"
        required: false
        default: "actualización manual"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:

      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Convertir CSV → JSON
        run: python scripts/csv_to_json.py

      - name: Commit y push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pedidos.json
          git diff --staged --quiet || git commit -m "data: ${{ github.event.inputs.mensaje }} — $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
